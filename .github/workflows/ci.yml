name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run typecheck && npm test && npm run build
      - run: node scripts/check-assets.mjs && python3 scripts/check-specs.py
      - run: git diff --exit-code -- packages/swift/Sources/WysiwygKit/Resources/editor
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci && npm run build
      - name: Provision isolated RAM-backed S3 and imgproxy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/media/ci-fixtures.sh
          python3 scripts/media/test-stack.py up --context '' --mc "$RUNNER_TEMP/wysiwyg-media-fixtures/mc" --minio-image bep9j4-test-minio:2025-09-07
      - run: node --env-file=.local/media-test.env node_modules/vitest/vitest.mjs run --config vitest.media.config.ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:media:browser
      # Deliberately no browser traces, screenshots or network artifact uploads: capabilities are private.
      - if: always()
        run: python3 scripts/media/test-stack.py down --context ''
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift test
      - run: swift build --package-path demos/swift
      - run: xcodebuild -quiet -project demos/swift/iOS/WysiwygDemo.xcodeproj -scheme WysiwygDemo -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/editor-ios-build CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build demos/windows -c Release
      - run: dotnet run --project tests/windows -c Release
